name: Bug report
description: Report unexpected behavior using a minimal synthetic example.
body:
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the version, OS, Node/Python versions, command, and synthetic inputs. Remove credentials and private paths.
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      render: text
